services:
  db:
    image: postgres:16-alpine
    container_name: storefront_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-storefront}
      POSTGRES_USER: ${POSTGRES_USER:-storefront_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-storefront_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-storefront_user} -d ${POSTGRES_DB:-storefront}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: storefront_api
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn storefront.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  test:
    build: .
    container_name: storefront_test
    profiles:
      - test
    command: python manage.py test --verbosity=2
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
